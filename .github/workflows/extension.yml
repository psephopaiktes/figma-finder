name: Extension checks and Chrome Web Store submission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate store authentication without uploading or submitting
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate versions against the previous main or PR base
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          node .github/scripts/release.mjs version "$BASE_SHA"
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify Client secret cannot enter distribution archives
        env:
          WXT_FIGMA_ID: ci-public-client
          WXT_FIGMA_SECRET: ci-only-secret-marker-7bf39a+/=
          LEAK_TEST_SECRET: ci-only-secret-marker-7bf39a+/=
        run: |
          npm run build
          npm run build:firefox
          node .github/scripts/release.mjs check-secrets
      - name: Build Chrome archive
        env:
          REQUIRE_FIGMA_CONFIG: ${{ (github.event_name == 'push' && steps.version.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
          WXT_FIGMA_ID: ${{ vars.WXT_FIGMA_ID }}
          WXT_AUTH_BASE_URL: ${{ vars.WXT_AUTH_BASE_URL }}
        run: |
          if [ "$REQUIRE_FIGMA_CONFIG" = true ]; then
            test -n "$WXT_FIGMA_ID" || { echo 'Set repository variable WXT_FIGMA_ID before real submission'; exit 1; }
          fi
          npm run build
          node .github/scripts/release.mjs archives chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-archive
          path: build/figma-finder-*-chrome.zip
          if-no-files-found: error
          retention-days: 14

  submit:
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.checks.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: store-submission-chrome
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-archive
          path: build
      - name: Check authentication or submit to Chrome Web Store
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: klifomaejfaibpkbigbpljdmelbkehbe
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ vars.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
        run: |
          for name in CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL CHROME_SERVICE_ACCOUNT_PRIVATE_KEY; do
            test -n "${!name}" || { echo "::error::Set repository Actions setting $name before submission"; exit 1; }
          done
          node .github/scripts/release.mjs submit chrome "$DRY_RUN"

  audit-development:
    name: Audit development tools (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Report all dependency advisories
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Explain development audit failure
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::warning::Dependency audit failed; inspect the audit output. Shipped dependencies are checked separately in the required checks job.'
          echo '### Development dependency audit needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the audit output above. This advisory job does not block Chrome submission; the required checks job still audits shipped dependencies.' >> "$GITHUB_STEP_SUMMARY"

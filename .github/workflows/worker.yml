name: OAuth Worker checks

on:
  pull_request:
    paths:
      - workers/figma-auth/**
      - .github/workflows/worker.yml
  push:
    branches: [main]
    paths:
      - workers/figma-auth/**
      - .github/workflows/worker.yml

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/figma-auth
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/figma-auth/.node-version
          cache: npm
          cache-dependency-path: workers/figma-auth/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
